<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="./src/assets/nintendo-gamecard.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simone van Buuren</title>
        <meta name="og:title" content="Simone van Buuren" />
        <script>
            // GitHub Pages SPA redirect: restore the real path from ?p=
            (function () {
                var p = new URLSearchParams(window.location.search).get('p');
                if (p) {
                    window.history.replaceState(null, '', decodeURIComponent(p));
                }
            })();
        </script>
    </head>
    <body
        class="w-screen animated-background h-screen bg-gradient-to-r from-violet-200 to-pink-200"
    >
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
