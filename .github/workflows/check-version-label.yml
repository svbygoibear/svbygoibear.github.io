name: Version Label Check

on:
    pull_request:
        types: [opened, synchronize, reopened, labeled, unlabeled]
        branches:
            - main

permissions:
    pull-requests: read

jobs:
    check-version-label:
        runs-on: ubuntu-latest
        steps:
            - name: Check for version label
              uses: actions/github-script@v7
              with:
                  script: |
                      const labels = context.payload.pull_request.labels.map(l => l.name);
                      const versionLabels = ['major', 'minor', 'patch'];
                      const hasVersionLabel = versionLabels.some(l => labels.includes(l));
                      if (!hasVersionLabel) {
                        core.setFailed(
                          `PR must have exactly one version label before merging: ${versionLabels.join(', ')}`
                        );
                      }
